# Controlled ablation; scripts/ablation selects the original recipe for each task.
projector:
  name: anchorread3d_a4_local_only
  hidden_size: 4096
  bias: true
  params:
    global_fraction: 0
    inner_dim: 768
    num_heads: 8
    ffn_expansion: 4
    dropout: 0.0
    checkpoint_blocks: true
    head_type: mlp
    position_mode: grid_fourier
    position_frequencies: 8
    sequence_condition: true
    global_depth: 1
    local_residual_scale_init: 0.1
