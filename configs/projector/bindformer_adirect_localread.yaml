# ADirect + one attention-only read of each child's original encoder patches.
# Same G/L allocation, global path, final LN/head and report CE; no local FFN.
projector:
  name: bindformer_adirect_localread
  hidden_size: 4096
  bias: true
  params:
    global_fraction: 0.25
    inner_dim: 768
    num_heads: 8
    ffn_expansion: 4
    dropout: 0.0
    checkpoint_blocks: true
    head_type: mlp
    position_mode: grid_fourier
    position_frequencies: 8
    sequence_condition: true
    global_depth: 1
    local_residual_scale_init: 0.1
