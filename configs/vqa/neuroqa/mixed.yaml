data:
  manifest_dir: assets/data/NeuroQA_derived/official_holdout_patient_guard_v1
  target_version: official_holdout_patient_guard_v1
  datasets: [brats]
  sampling: balanced_neuroqa
  invalid_sample_policy: skip
  modality_sampling: dual_eligible
preprocessing:
  name: neuroqa_mni1mm
  cache_dir: assets/preprocessing/neuroqa_mni1mm_v1
  spacing_policy: native_grid
  throughplane_mm: 1.0
  inplane_mm: 1.0
  boundary_policy: minimal_pad
  orientation: RPI
  image_interpolation: linear
projector:
  name: avgpool3d
  budget_protocol: neuroqa_mni1mm_shared_m_v1
  target_compression_ratio: 128
task:
  name: neuroqa
  prompt_version: neuroqa_single_volume_v1
training:
  stage: joint_lora
  feature_cache: false
  feature_cache_dir: cache/features/vqa/neuroqa
  effective_batch_size: 16
  microbatch_per_device: 1
  projector_lr: 2.0e-4
  encoder_lr: 2.0e-4
  max_epochs: 20
  warmup_ratio: 0
  projector_warmup_steps: 150
  projector_hold_steps: 0
  joint_warmup_steps: 150
  projector_warmup_ratio: 0.05  # Fallback only when explicit steps is null.
  joint_warmup_ratio: 0.05      # Fixed 150-step warmups take precedence.
  cosine_min_lr_ratio: 1.0     # Constant LR after both warmups.
  joint_warmup_projector_mode: hold_peak
  early_stopping_min_delta: 0.002
  early_stopping_patience: 3
  run_dir: runs/vqa/neuroqa/default
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
generation:
  max_new_tokens: 192
